<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Auction Client - Аукционное приложение</title>
  <base href="/">
  
  <!-- Viewport и основные meta теги -->
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta name="description" content="Найдите интересные лоты и делайте ставки в нашем аукционном приложении">
  <meta name="keywords" content="аукцион, лоты, ставки, торги, покупки">
  <meta name="author" content="Auction Team">
  
  <!-- PWA Meta теги -->
  <meta name="theme-color" content="#2c3e50">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Auction">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="application-name" content="Auction">
  
  <!-- Иконки -->
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="icons/icon512_rounded.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icons/icon512_rounded.png">
  
  <!-- Manifest -->
  <link rel="manifest" href="manifest.json">
  
  <!-- Стили -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  
  <!-- Регистрация Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('/sw.js')
          .then(function(registration) {
            console.log('ServiceWorker зарегистрирован успешно: ', registration.scope);
          })
          .catch(function(error) {
            console.log('ServiceWorker регистрация не удалась: ', error);
          });
      });
    }
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
