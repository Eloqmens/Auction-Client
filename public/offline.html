<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Нет подключения - Auction</title>
    <style>
        body {
            font-family: 'Roboto', Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }
        
        .offline-container {
            max-width: 400px;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        
        .offline-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.8;
        }
        
        h1 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            font-weight: 500;
        }
        
        p {
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 2rem;
            opacity: 0.9;
        }
        
        .retry-btn {
            background: #3498db;
            color: white;
            border: none;
            padding: 0.75rem 2rem;
            border-radius: 25px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s ease;
            font-weight: 500;
        }
        
        .retry-btn:hover {
            background: #2980b9;
        }
        
        .features {
            margin-top: 2rem;
            text-align: left;
        }
        
        .feature {
            display: flex;
            align-items: center;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            opacity: 0.8;
        }
        
        .feature-icon {
            margin-right: 0.5rem;
            width: 16px;
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="offline-icon">📶</div>
        <h1>Нет подключения к интернету</h1>
        <p>
            Не удается подключиться к серверу. Проверьте подключение к интернету и попробуйте снова.
        </p>
        
        <button class="retry-btn" onclick="window.location.reload()">
            Попробовать снова
        </button>
        
        <div class="features">
            <div class="feature">
                <span class="feature-icon">✓</span>
                Приложение работает офлайн
            </div>
            <div class="feature">
                <span class="feature-icon">✓</span>
                Данные сохранены локально
            </div>
            <div class="feature">
                <span class="feature-icon">✓</span>
                Автоматическая синхронизация при подключении
            </div>
        </div>
    </div>
    
    <script>
        // Проверяем подключение каждые 5 секунд
        setInterval(function() {
            if (navigator.onLine) {
                window.location.reload();
            }
        }, 5000);
        
        // Слушаем событие восстановления подключения
        window.addEventListener('online', function() {
            window.location.reload();
        });
    </script>
</body>
</html>
